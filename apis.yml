apis:
- name: PagBank PIX API
  description: >-
    Dedicated API for PIX instant payment infrastructure in Brazil. Supports immediate charge creation
    via QR codes, payment receipt confirmation, and real-time notifications for PIX transactions.
  humanURL: https://developer.pagbank.com.br/reference/introducao
  baseURL: https://api.pagseguro.com
  tags:
  - Pix
  - Instant Payments
  - QR Codes
  tags_raw:
  - PIX
  - Instant Payments
  - QR Code
  properties:
  - type: Documentation
    url: https://developer.pagbank.com.br/docs/apis-pagbank
- name: PagBank Recurring Payments API
  description: >-
    Subscription billing API for managing recurring charges. Handles subscription creation, billing cycles,
    payment method updates, and recurring payment indicators for installment plans.
  humanURL: https://developer.pagbank.com.br/docs/apis-pagbank
  baseURL: https://api.pagseguro.com
  tags:
  - Recurring Payments
  - Subscription
  - Billing
  tags_raw:
  - Recurring Payments
  - Subscriptions
  - Billing
  properties:
  - type: Documentation
    url: https://developer.pagbank.com.br/docs/apis-pagbank
- aid: pagbank:boleto
  name: PagBank Boleto API
  description: >-
    Boleto Bancário issuance and collection. Generates a printable / scannable boleto tied to an Order,
    with status callbacks once the buyer pays at a bank, lottery house, or via internet banking.
  humanURL: https://developer.pagbank.com.br/reference/criar-pedido-com-boleto
  baseURL: https://api.pagseguro.com
  tags:
  - Boleto
  - Brazil
  - Collection
  tags_raw:
  - Boleto
  - Brazil
  - Collections
  properties:
  - type: Documentation
    url: https://developer.pagbank.com.br/docs/apis-pagbank
- aid: pagbank:split
  name: PagBank Marketplace / Split API
  description: >-
    Payment-division (split) settlement for marketplaces and platforms. Splits a single charge across
    multiple receivers (with optional custody / release control) so each seller is settled directly by
    PagBank.
  humanURL: https://developer.pagbank.com.br/reference/criar-pedido-com-split
  baseURL: https://api.pagseguro.com
  tags:
  - Marketplace
  - Split
  - Settlement
  properties:
  - type: Documentation
    url: https://developer.pagbank.com.br/docs/apis-pagbank
- aid: pagbank:edi
  name: PagBank EDI API
  description: >-
    Electronic Data Interchange surface for downloading transaction and settlement statements for reconciliation
    — a structured replacement for manual CSV/PDF statement processing.
  humanURL: https://developer.pagbank.com.br/docs/edi
  baseURL: https://api.pagseguro.com
  tags:
  - EDI
  - Reconciliation
  - Statements
  properties:
  - type: Documentation
    url: https://developer.pagbank.com.br/docs/apis-pagbank
- aid: pagbank:certificates
  name: PagBank Digital Certificate (mTLS) API
  description: >-
    Issues digital certificates for mTLS authentication, layered on top of bearer-token auth for higher-trust
    integrations and sensitive payouts / Pix Bacen flows.
  humanURL: https://developer.pagbank.com.br/docs/certificado-digital
  baseURL: https://api.pagseguro.com
  tags:
  - mTLS
  - Security
  - Certificates
  properties:
  - type: Documentation
    url: https://developer.pagbank.com.br/docs/apis-pagbank
